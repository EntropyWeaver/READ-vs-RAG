name: offline-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m read_vs_rag fetch-upstream
      - run: python -m unittest discover -s tests -v
      - run: python -m read_vs_rag plan --limit 2
      - run: python -m read_vs_rag smoke --output reports/ci-smoke.json
      - run: python -m read_vs_rag audit --output reports/ci-audit
